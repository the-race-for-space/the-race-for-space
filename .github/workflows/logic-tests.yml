name: Logic Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  logic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run logic and controller regressions
        run: bash tools/run-logic-tests.sh
