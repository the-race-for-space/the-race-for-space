name: Naming Refactor Audit

on:
  push:
    branches:
      - Alpha/KerbalContracts-v0.5

permissions:
  contents: read

jobs:
  audit:
    if: "github.event.head_commit.message == 'chore: audit naming refactor'"
    runs-on: ubuntu-latest

    steps:
      - name: Check out renamed source
        uses: actions/checkout@v4

      - name: Find legacy terminology
        run: |
          echo '--- filenames ---'
          find src tests -type f | grep -E 'RaceRuntime|RaceSettings|SatelliteRace|Milestone|ProgramState|Starter|FundingProgramme|AchievementFunding|KspVesselDiscovery|SatelliteTracker|RaceWindow|SpaceRace' || true
          echo '--- source/test references ---'
          grep -RInE --include='*.cs' --include='*.csproj' 'Programme|programme|Achievement|achievement|Starter|starter|Milestone|milestone|SpaceRace|SatelliteRace|RaceRuntime|RaceSettings|SpaceProgramState|FundingProgramme|KspVesselDiscovery|SatelliteTracker|RaceWindow|ProgramId|programIndex|Programs\b|programs\b' src tests || true
