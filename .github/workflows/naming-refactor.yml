name: Finalize Naming Refactor

on:
  push:
    branches:
      - Alpha/KerbalContracts-v0.5

permissions:
  contents: write

jobs:
  finalize:
    if: "github.event.head_commit.message == 'chore: finalize naming refactor'"
    runs-on: ubuntu-latest

    steps:
      - name: Check out renamed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Remove final legacy wording and temporary tooling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/TheRaceForSpace/Funding/FundingContractCatalogue.cs': [
                  ('starter catalogue', 'pre-orbit catalogue'),
              ],
              'src/TheRaceForSpace/Campaign/CampaignController.cs': [
                  ('cached active starter set', 'cached active flight-contract set'),
                  ('unlocked starter target', 'unlocked pre-orbit target'),
                  ('starter offers', 'pre-orbit offers'),
              ],
              'src/TheRaceForSpace/Core/ModRuntime.cs': [
                  ('new starter result', 'new flight-contract result'),
              ],
              'src/TheRaceForSpace/Objectives/ObjectiveDefinition.cs': [
                  ('starter definition', 'pre-orbit definition'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          bash tools/run-logic-tests.sh

          echo '--- legacy production naming check ---'
          if grep -RInE --include='*.cs' 'Programme|programme|Achievement|achievement|Starter|starter|Milestone|milestone|HasProgram|DoesProgram|CreatePrograms|programIndex|Programs\b|programs\b' src; then
            echo 'Legacy production naming remains.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/naming-refactor.yml tools/refactor-naming.py
          git add -A
          git commit -m 'refactor: finalize naming cleanup'
          git push origin HEAD:Alpha/KerbalContracts-v0.5
