name: Naming Refactor

on:
  push:
    branches:
      - Alpha/KerbalContracts-v0.5

permissions:
  contents: write

jobs:
  refactor:
    if: "github.event.head_commit.message == 'chore: run naming refactor'"
    runs-on: ubuntu-latest

    steps:
      - name: Check out refactor trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply approved naming refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/refactor-naming.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('(r"\\bachievement\\b", "objective completion"),', '(r"\\bachievement\\b", "objectiveCompletion"),')
          text = text.replace(
              '        ("PlayerProgram", "PlayerAgency"),',
              '        ("PlayerProgram", "PlayerAgency"),\n'
              '        ("_programs", "_agencies"),\n'
              '        ("Programs { get", "Agencies { get"),\n'
              '        ("ProgramId", "AgencyId"),\n'
              '        ("programIndex", "agencyIndex"),'
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/refactor-naming.py
